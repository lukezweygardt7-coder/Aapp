name: Build mods

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Unzip project
        run: unzip -o mc-mods.zip -d project

      - name: Build Aapp Chat Clear
        working-directory: project/aapp-chat-clear
        run: gradle build --no-daemon

      - name: Build Aapp Pig
        working-directory: project/aapp-pig
        run: gradle build --no-daemon

      - name: Build Minecraft Texts
        working-directory: project/minecraft-texts
        run: gradle build --no-daemon

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: aapp-mods
          path: |
            project/aapp-chat-clear/build/libs/*.jar
            project/aapp-pig/build/libs/*.jar
            project/minecraft-texts/build/libs/*.jar
